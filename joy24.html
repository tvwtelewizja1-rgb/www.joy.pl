<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy 24 – TV Joy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #ffffff;
            --text-muted: #cbd5e1;
        }
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Gotham Bold', 'Gotham', 'Segoe UI', sans-serif; 
            font-weight: 700;
        }
        body {
            background: url('tlo-czerwone.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #b71c1c;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            background-color: rgba(183, 28, 28, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .logo { text-decoration: none; display: flex; align-items: center; gap: 12px; }
        
        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffeb3b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        nav { display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 700; }
        nav a:hover, nav a.active { color: #ffeb3b; }
        .yt-btn { background-color: #ff0000; color: white !important; padding: 0.5rem 1rem; border-radius: 50px; display: flex; align-items: center; gap: 0.5rem; }
        
        .container { max-width: 800px; margin: auto; padding: 4rem 1.5rem; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .content-box { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border-radius: 16px; padding: 4rem 3rem; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .content-box h1 { font-size: 3rem; margin-bottom: 1.5rem; color: #ffeb3b; }
        .content-box p { font-size: 2rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); }
        
        /* Sekcja Spotify Polecajki */
        .spotify-section {
            margin-top: 4rem;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            text-align: left;
        }
        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .spotify-title {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #1db954;
        }
        .spotify-btn {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .spotify-btn:hover {
            background-color: #1ed760;
            transform: scale(1.03);
        }
        .spotify-player-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }

        footer { background-color: rgba(183, 28, 28, 0.9); text-align: center; padding: 2rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="PFPjoy10kl.jpg" alt="TV Joy Logo" class="logo-img">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="joy24.html" class="active">Joy 24</a>
            <a href="https://www.youtube.com/@joy_twoja_u%C5%9Bmiechni%C4%99ta_tv" target="_blank" class="yt-btn">
                <i class="fa-brands fa-youtube"></i> Subskrybuj
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="content-box">
            <h1>Joy 24</h1>
            <p>Wkrótce</p>
        </div>

        <!-- Polecajka muzyczna Spotify na dole strony -->
        <section class="spotify-section">
            <div class="spotify-header">
                <h3 class="spotify-title"><i class="fa-brands fa-spotify"></i> Muzyczna Polecajka Dnia TV Joy</h3>
                <button class="spotify-btn" onclick="randomizeSpotifyTrack()">
                    <i class="fa-solid fa-shuffle"></i> Wylosuj inny utwór
                </button>
            </div>
            <div class="spotify-player-wrapper">
                <iframe id="spotify-player" style="border-radius:12px" src="" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 TV Joy – Twoja Uśmiechnięta TV. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <script>
        // Lista ID zweryfikowanych utworów Spotify (bez wulgaryzmów)
        const safeSpotifyTracks = [
            '0VjeePi8mRGlx0KYrE2t2M', // Coldplay - Viva La Vida
            '4uLU6hMCjMI75M1A2tKUQC', // Queen - Don't Stop Me Now
            '0b90gQ8GjKGj6vR616jW9d', // Dawid Podsiadło - Małomiasteczkowy
            '2TAK21z2WmZSp27eaF5zch', // Sanah - Szampan
            '1BxfuMiLl4Wtx2y2x7j70u', // Michael Jackson - Billie Jean
            '3u1S1E8yP0vR1j3i3bUq3E', // ABBA - Dancing Queen
            '0c489yWenHGlDFf4yebvYQ', // A-ha - Take on Me
            '60nZcImufyMA1MKQY3dcCH', // Pharrell Williams - Happy
            '6w899j7S3l048p0p2GfN0L', // Sanah, Dawid Podsiadło - Ostatnia nadzieja
            '3yTkoTuiKRz1g2pPq0Y16i'  // Dua Lipa - Levitating
        ];

        let currentTrackIndex = -1;

        function randomizeSpotifyTrack() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * safeSpotifyTracks.length);
            } while (randomIndex === currentTrackIndex && safeSpotifyTracks.length > 1);

            currentTrackIndex = randomIndex;
            const trackId = safeSpotifyTracks[randomIndex];
            const playerIframe = document.getElementById('spotify-player');
            
            playerIframe.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0&t=${Date.now()}`;
        }

        // Inicjalne losowanie utworu przy wczytaniu strony
        randomizeSpotifyTrack();
    </script>
</body>
</html>
